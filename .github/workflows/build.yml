# Release process:
#   1. Bump "version" in package.json to X.Y.Z (must match the tag).
#   2. Commit, tag vX.Y.Z, push the tag.
#   3. This workflow uploads the installers plus the latest.yml /
#      latest-mac.yml feed files that electron-updater reads to a DRAFT
#      GitHub Release (electron-builder's default releaseType).
#   4. Once both jobs pass, open the draft on GitHub and click "Publish
#      release". Installed apps cannot see drafts, so nothing ships before this.
# Installed apps check the feed on launch: Windows auto-updates (prompt to
# restart), mac shows a download banner (unsigned builds can't self-install).
#
# workflow_dispatch runs still build without publishing and upload artifacts,
# for testing the packaging itself.

name: Build Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci
        working-directory: renderer

      - name: Build and publish release (Windows)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and package (Windows, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run electron:pack

      - name: Upload Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci
        working-directory: renderer

      - name: Build and publish release (macOS)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run electron:publish:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and package (macOS, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run electron:pack:mac

      - name: Upload macOS installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: release/*.dmg
